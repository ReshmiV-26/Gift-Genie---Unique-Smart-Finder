<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Genie - Smart Gift Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎁 Gift Genie</h1>
        <p>Find the Perfect Gift for Everyone!</p>
    </header>

    <main class="container">

        <h2>Welcome to Gift Genie!</h2>

        <p class="description">
            Find the perfect gift for your loved ones
            based on your budget and occasion.
        </p>

        <button id="startBtn">Find a Gift ✨</button>

        <section id="giftForm" class="hidden">

            <h2>Tell Us About Your Gift</h2>

            <label for="person">Who is the gift for?</label>
            <select id="person">
                <option value="Friend">Friend</option>
                <option value="Family">Family</option>
                <option value="Partner">Partner</option>
            </select>

            <label for="occasion">Select Occasion</label>
            <select id="occasion">
                <option value="Birthday">Birthday</option>
                <option value="Anniversary">Anniversary</option>
                <option value="Graduation">Graduation</option>
            </select>

            <label for="budget">Select Your Budget</label>
            <select id="budget">
                <option value="300">Under ₹300</option>
                <option value="500">Under ₹500</option>
                <option value="1000">Under ₹1000</option>
            </select>

            <button id="findBtn">Get Gift Ideas 🎁</button>

        </section>

        <section id="result" class="hidden">
            <h2>Your Gift Suggestions</h2>
            <div id="giftList"></div>
        </section>

    </main>

    <footer>
        <p>Made with ❤️ | Gift Genie 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
